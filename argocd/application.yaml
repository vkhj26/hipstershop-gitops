apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: keycloak
    targetRevision: "21.0.2"

    helm:
      values: |
        image:
          repository: bitnamilegacy/keycloak
          tag: 26.3.1-debian-12-r1

        auth:
          adminUser: admin
          adminPassword: admin1234

        postgresql:
          enabled: true
          image:
            repository: bitnami/postgresql
            tag: 15.5.0-debian-12-r0

        keycloakConfigCli:
          enabled: false

        service:
          type: ClusterIP

  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true