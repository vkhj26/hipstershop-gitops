apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vkhj26/hipstershop-gitops.git # <--- TU REPO DE GIT
    path: apps/keycloak/helm # <--- LA CARPETA DONDE ESTÁ TU VALUES.YAML
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml # <--- AQUÍ LE DICES QUE USE TU ARCHIVO
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true