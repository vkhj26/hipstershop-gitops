apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    # URL directa al chart como en tu ejemplo
    repoURL: https://charts.bitnami.com/bitnami/keycloak 
    targetRevision: 25.2.0  # Versión que aparece en tu imagen
    chart: keycloak
    helm:
      # Como la URL ya es el Helm, pasamos los valores directamente aquí
      # para no complicar con fuentes múltiples (Multiple Sources)
      values: |
        image:
          registry: docker.io
          repository: bitnamilegacy/keycloak
          tag: 26.3.1-debian-12-r1
        auth:
          adminUser: admin
          adminPassword: admin1234
        postgresql:
          enabled: true
          image:
            registry: docker.io
            repository: bitnamilegacy/postgresql
            tag: 15.5.0-debian-12-r0
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true