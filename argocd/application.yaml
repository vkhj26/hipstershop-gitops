apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami   # repo oficial de Bitnami
    chart: keycloak
    targetRevision: 26.3.1                      # version de la imagen/helm
    helm:
      values: |
        image:
          tag: 26.3.1-debian-12-r1
        auth:
          adminUser: admin
          adminPassword: admin123
        service:
          type: ClusterIP
        postgresql:
          enabled: true
        keycloakConfigCli:
          enabled: true
          image:
            repository: bitnami/keycloak-config-cli
          configuration:
            existingConfigmap: keycloak-config

  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true