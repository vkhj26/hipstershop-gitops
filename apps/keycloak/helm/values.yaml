image:
  repository: bitnami/keycloak
  tag: 26.3.1-debian-12-r1

auth:
  adminUser: admin
  adminPassword: admin12345

service:
  type: ClusterIP

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: 17.5.0-debian-12-r0   # versión que sí existe

keycloakConfigCli:
  enabled: true
  image:
    repository: bitnami/keycloak-config-cli
  configuration:
    existingConfigmap: keycloak-config