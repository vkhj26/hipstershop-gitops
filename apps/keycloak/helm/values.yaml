image:
  registry: docker.io
  repository: bitnamilegacy/keycloak
  tag: "26.3.1-debian-12-r1"
  pullPolicy: IfNotPresent
production: false
proxy: edge
auth:
  adminUser: admin
  adminPassword: "admin1234"
postgresql:
  enabled: false
externalDatabase:
  host: "postgresql"
  port: 5432
  user: "bn_keycloak"
  password: "keycloak1234"
  database: "bitnami_keycloak"
  existingSecret: ""
  existingSecretPasswordKey: ""
extraEnvVars:
  - name: KC_DB_PASSWORD
    value: "keycloak1234"
keycloakConfigCli:
  enabled: false
service:
  type: ClusterIP
  ports:
    http: 80
resources:
  requests: